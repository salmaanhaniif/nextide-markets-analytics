name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at 02:00 UTC — well after the weekly candle closes
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/requirements-inference.txt

      - name: Install dependencies
        run: pip install -r requirements-inference.txt

      - name: Run retraining (XGBoost)
        run: python -m data_pipeline.retrain

      - name: Run inference with new models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python daily-inference.py

      - name: Commit updated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/xgb_model_target_y1.pkl
          git add models/xgb_model_target_y7.pkl
          git add models/xgb_model_target_y30.pkl
          git add models/target_scaler_target_y1.pkl
          git add models/target_scaler_target_y7.pkl
          git add models/target_scaler_target_y30.pkl
          git add models/feature_scaler.pkl
          git add models/pca_transformer.pkl
          git add models/model_metadata.json
          git add data/latest_prediction.json data/latest_prediction_lstm.json
          git add data/prediction_history.json data/prediction_history_lstm.json
          git diff --cached --quiet || git commit -m "chore(models): weekly retrain $(date -u +%Y-%m-%d)"
          git push
