name: Daily Bitcoin Inference

on:
  schedule:
    # Runs at 00:10 UTC daily (07:10 WIB) — 10 minutes after BTC daily candle closes at 00:00 UTC
    - cron: '10 0 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write
  
jobs:
  run-inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend/requirements-inference.txt

      - name: Install dependencies
        run: pip install -r requirements-inference.txt

      - name: Run inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python daily-inference.py

      - name: Commit updated prediction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_prediction.json data/latest_prediction_lstm.json
          git add data/prediction_history.json data/prediction_history_lstm.json
          git diff --cached --quiet || git commit -m "chore(data): daily inference $(date -u +%Y-%m-%d)"
          git push
